name: yiclass
description: 一个课表管理工具，支持多种课程表格式导入，支持多种平台。

version: 2.3.5

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.5
  intl: ^0.19.0
  permission_handler: ^12.0.0+1
  path_provider: ^2.1.5
  isar_plus: ^1.1.8
  isar_plus_flutter_libs: ^1.1.8
  file_selector: ^1.0.3
  http: ^1.1.0
  image_picker: ^1.0.4
  path: ^1.9.0
  webview_flutter: ^4.4.2
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4
  android_intent_plus: ^5.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  build_runner: ^2.10.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - LICENSE
